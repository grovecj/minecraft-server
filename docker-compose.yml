services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"      # Java Edition
      - "19132:19132/udp"  # Bedrock Edition (GeyserMC)
    expose:
      - "8100"             # BlueMap (internal, proxied by Caddy)
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # Pinned, not "LATEST": the plugin jars below are built for one Minecraft
      # version. With LATEST, a restart after a new Minecraft release starts a
      # server the plugins can't load on. To upgrade, change this and the
      # plugin URLs together.
      VERSION: "26.2"
      MEMORY: "3G"

      # Server properties
      MOTD: "\u00a7bCarter\u00a77's \u00a7aMinecraft Server"
      MAX_PLAYERS: 20
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      DIFFICULTY: normal
      MODE: survival
      PVP: "true"
      SPAWN_PROTECTION: 0
      ENABLE_COMMAND_BLOCK: "true"
      ALLOW_NETHER: "true"
      ONLINE_MODE: "true"

      # Performance tuning (Aikar's flags for GC optimization)
      USE_AIKAR_FLAGS: "true"

      # Plugins (direct URLs to avoid Modrinth version-matching issues).
      # Each is the build for the VERSION above; find others under
      # https://modrinth.com/plugin/<name>/versions
      PLUGINS: |
        https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar
        https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar
        https://cdn.modrinth.com/data/1u6JkXh5/versions/J1eeOh6C/worldedit-bukkit-7.4.6-beta-02.jar
        https://cdn.modrinth.com/data/DKY9btbd/versions/TtfwTyi6/worldguard-bukkit-7.0.19.jar
        https://cdn.modrinth.com/data/Lu3KuzdV/versions/3sehX6Sg/CoreProtect-CE-24.1.jar
        https://cdn.modrinth.com/data/swbUV1cr/versions/pILlMIlN/bluemap-5.28-paper.jar
        https://cdn.modrinth.com/data/P1OZGk5p/versions/5WgnasGG/ViaVersion-5.12.1.jar
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/fALzjamp/versions/MdY6JATr/Chunky-Bukkit-1.5.3.jar

    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - minecraft

volumes:
  caddy_data:
  caddy_config:
