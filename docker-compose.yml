services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"      # Java Edition
      - "19132:19132/udp"  # Bedrock Edition (GeyserMC)
    expose:
      - "8100"             # BlueMap (internal, proxied by Caddy)
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "LATEST"
      MEMORY: "3G"

      # Server properties
      MOTD: "\u00a7bCarter\u00a77's \u00a7aMinecraft Server"
      MAX_PLAYERS: 20
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      DIFFICULTY: normal
      MODE: survival
      PVP: "true"
      SPAWN_PROTECTION: 0
      ENABLE_COMMAND_BLOCK: "true"
      ALLOW_NETHER: "true"
      ONLINE_MODE: "true"

      # Performance tuning (Aikar's flags for GC optimization)
      USE_AIKAR_FLAGS: "true"

      # Plugins (direct URLs to avoid Modrinth version-matching issues)
      PLUGINS: |
        https://cdn.modrinth.com/data/hXiIvTyT/versions/Oa9ZDzZq/EssentialsX-2.21.2.jar
        https://cdn.modrinth.com/data/Vebnzrzj/versions/OrIs0S6b/LuckPerms-Bukkit-5.5.17.jar
        https://cdn.modrinth.com/data/1u6JkXh5/versions/CkT32vix/worldedit-bukkit-7.4.0.jar
        https://cdn.modrinth.com/data/DKY9btbd/versions/oyjmf4DD/worldguard-bukkit-7.0.16-beta-01.jar
        https://cdn.modrinth.com/data/Lu3KuzdV/versions/HD2IvrxS/CoreProtect-CE-23.1.jar
        https://cdn.modrinth.com/data/swbUV1cr/versions/nTnTxZjy/bluemap-5.16-spigot.jar
        https://cdn.modrinth.com/data/P1OZGk5p/versions/iuIj8EtY/ViaVersion-5.7.2-SNAPSHOT.jar
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/fALzjamp/versions/P3y2MXnd/Chunky-Bukkit-1.4.40.jar

    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - minecraft

volumes:
  caddy_data:
  caddy_config:
